# phantom_ relay - ONE container (WireGuard + relay). No clone, no build.
#
# 1. Put your WireGuard client config as  ./wg0.conf  next to this file.
# 2. docker compose up -d
# 3. Check:  docker exec phantom-relay node server.js --check
#
# Change the ENV -> `docker compose up -d` (applies it), restart -> `docker restart phantom-relay`.

services:
  relay:
    # Pinned to a fixed release tag (supply-chain: avoid the moving ':latest', which could pull an
    # unexpected image on the next 'docker compose up'). Bump this to a newer tag deliberately.
    # MOST reproducible: pin by DIGEST instead of a tag (a tag can be re-pushed, a digest cannot). Get it
    # with 'docker buildx imagetools inspect ghcr.io/phantomtv-app/relay:1.0.0' and reference it as:
    #   image: ghcr.io/phantomtv-app/relay:1.0.0@sha256:REPLACE_WITH_REAL_DIGEST
    image: ghcr.io/phantomtv-app/relay:1.0.0   # or: docker.io/phantomtvapp/relay:1.0.0
    container_name: phantom-relay
    cap_add:
      - NET_ADMIN                     # for WireGuard in the container
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./wg0.conf:/etc/wireguard/wg0.conf:ro   # your VPN config
    ports:
      # Safe default: bound to localhost only. To reach the relay from your TV/LAN, change this to
      # "8787:8787" (all interfaces) - but set an access mode (RELAY_AUTH=basic/ip) below FIRST.
      - "127.0.0.1:8787:8787"
    environment:
      - RELAY_VPN_IF=wg0
      # Access control. NO default: if RELAY_AUTH is unset the relay DENIES /p (fail-closed, HTTP 403).
      # A fresh `docker compose up -d` with the block below still commented = deny mode. Pick ONE:
      # User/password (recommended). Docker does NOT auto-generate a password (only install.sh does),
      # and placeholders like 'change-me' are REJECTED (fail-closed) - generate one: `openssl rand -hex 24`:
      #   - RELAY_AUTH=basic
      #   - RELAY_USER=phantom
      #   - RELAY_PASS=<paste output of: openssl rand -hex 24>
      # or only specific client IPs (note: with CORS=* this is not origin/app auth - prefer basic online):
      #   - RELAY_AUTH=ip
      #   - RELAY_ALLOW=1.2.3.4,5.6.7.8
      # or, ONLY on a trusted LAN, no access control at all (explicit opt-in):
      #   - RELAY_AUTH=open
      # Local dev without a VPN (disables the fail-closed guard -> forwards UNPROTECTED, dev only):
      #   - RELAY_ALLOW_UNPROTECTED=1
      # Egress lookup is OFF by default (no outbound call). Opt in to show the relay's own exit IP in
      # /health (uses your own /api/my-ip, not a third party) and enable the RELAY_REAL_IP leak veto:
      #   - RELAY_EGRESS_LOOKUP=1
      # Behind a reverse proxy, set the fixed public base (else the Host header is used):
      #   - RELAY_PUBLIC_URL=https://relay.example
      #   - RELAY_TRUSTED_PROXIES=  # comma list of proxy IPs allowed to set X-Forwarded-*
      # Active leak self-check (report vpn:false if egress equals your real, non-VPN IP):
      #   - RELAY_REAL_IP=
    restart: unless-stopped
