# Builds the relay image (multi-arch amd64+arm64) and publishes it to GHCR - and, if the
# Docker Hub secrets are set, ADDITIONALLY to Docker Hub.
#
#   GHCR:        docker pull ghcr.io/phantomtv-app/relay:latest
#   Docker Hub:  docker pull phantomtvapp/relay:latest        (adjust the namespace below if needed)
#
# GHCR needs no extra secrets (GITHUB_TOKEN). For Docker Hub, set these in the repo:
#   Settings -> Secrets and variables -> Actions:  DOCKERHUB_USERNAME , DOCKERHUB_TOKEN
# Without these secrets it only pushes to GHCR (the job does NOT fail).

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Weekly rebuild (Mon 04:00 UTC) so the rolling base image (latest Node LTS / Alpine)
    # and its security patches reach the published :latest even without a code change.
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # Gate: the image is only built/pushed when tests AND typecheck pass. A failing test
  # here blocks the publish below (build-push needs: verify).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub login (only if secrets are set)
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/phantomtv-app/relay
            name=docker.io/${{ env.DOCKERHUB_USER }}/relay,enable=${{ env.DOCKERHUB_USER != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
